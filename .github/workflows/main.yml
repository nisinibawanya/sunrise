name: Sunrise Dental CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Sunrise_Dental

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Compile Java source
        run: |
          mkdir -p build/classes
          javac -cp "lib/*:src/main/webapp/WEB-INF/lib/*" \
            -d build/classes \
            $(find src/main/java -name "*.java")

      - name: Run JUnit tests
        run: |
          java -jar lib/junit-platform-console-standalone-1.10.2.jar \
            execute \
            --class-path "build/classes:lib/*:src/main/webapp/WEB-INF/lib/*" \
            --scan-class-path \
            --fail-if-no-tests
